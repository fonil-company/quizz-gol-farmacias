[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev --include=optional"]

[phases.caddy]
dependsOn = ["setup"]
nixPkgs = ["caddy"]
cmds = ["caddy validate --config /app/Caddyfile --adapter caddyfile"]

[phases.build]
dependsOn = ["install", "caddy"]
cmds = ["npm run build"]

[start]
cmd = "node --env-file-if-exists=/app/.env.production /app/server/capi.mjs & exec caddy run --config /app/Caddyfile --adapter caddyfile"
